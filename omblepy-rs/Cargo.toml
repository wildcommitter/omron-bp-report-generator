[package]
name = "omblepy-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of omblepy — reads records from Omron BLE blood-pressure monitors."
license = "MIT"

[[bin]]
name = "omblepy-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
